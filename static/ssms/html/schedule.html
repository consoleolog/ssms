<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>전산근무표 일정 | SSMS</title>
	<link rel="stylesheet" href="../../krds/resources/css/component/output.css">
	<link rel="stylesheet" href="../css/font.css">
	<link rel="stylesheet" href="../css/schedule.css">
</head>
<body>
<div id="wrap">
	<main id="container">
		<div class="inner ssms-schedule">
			<!-- 페이지 제목 -->
			<div class="ssms-schedule__header">
				<h2 class="ssms-schedule__title">전산근무표</h2>
			</div>
			<!-- //페이지 제목 -->

			<!-- 달력 툴바 -->
			<div class="ssms-schedule__toolbar">
				<div class="ssms-schedule__nav">
					<button type="button" class="krds-btn medium icon border" id="btn_prev_month">
						<span class="sr-only">이전 달</span>
						<i class="svg-icon ico-angle left"></i>
					</button>
					<h3 class="ssms-schedule__month" id="schedule_month"></h3>
					<button type="button" class="krds-btn medium icon border" id="btn_next_month">
						<span class="sr-only">다음 달</span>
						<i class="svg-icon ico-angle right"></i>
					</button>
					<button type="button" class="krds-btn small tertiary" id="btn_today">오늘</button>
				</div>
				<div class="ssms-schedule__actions">
					<div class="krds-badge-wrap" aria-label="근무 범례">
						<span class="krds-badge bg-light-primary">오전</span>
						<span class="krds-badge bg-light-point">오후</span>
						<span class="krds-badge bg-light-success">종일</span>
					</div>
					<button type="button" class="krds-btn medium secondary" id="btn_auto_assign">
						<i class="svg-icon ico-refresh"></i>
						자동 편성
					</button>
				</div>
			</div>
			<!-- //달력 툴바 -->

			<!-- 공휴일 설정 -->
			<div class="krds-disclosure conts-expand-area ssms-holiday">
				<button type="button" class="btn-conts-expand">공휴일 설정</button>
				<div class="expand-wrap">
					<div class="expand-in">
						<form id="holiday_form" novalidate>
							<div class="fieldset">
								<div class="form-col-group">
									<div class="form-group">
										<div class="form-tit">
											<label for="holiday_date">날짜</label>
										</div>
										<div class="form-conts">
											<input type="text" id="holiday_date" class="krds-input" placeholder="YYYY-MM-DD" inputmode="numeric" maxlength="10" autocomplete="off" aria-describedby="holiday_date_hint">
										</div>
										<p class="form-hint" id="holiday_date_hint">예: 2026-10-05</p>
									</div>
									<div class="form-group">
										<div class="form-tit">
											<label for="holiday_name">공휴일명</label>
										</div>
										<div class="form-conts">
											<input type="text" id="holiday_name" class="krds-input" maxlength="20" autocomplete="off" aria-describedby="holiday_name_hint">
										</div>
										<p class="form-hint" id="holiday_name_hint">예: 임시공휴일 (20자 이내)</p>
									</div>
								</div>
								<button type="submit" class="krds-btn medium secondary">공휴일 추가</button>
							</div>
						</form>
						<h4 class="ssms-holiday__title" id="holiday_list_title"></h4>
						<!-- 표시 중인 달의 공휴일 목록은 schedule.js에서 렌더링 -->
						<ul class="ssms-holiday__list" id="holiday_list" aria-labelledby="holiday_list_title" tabindex="-1"></ul>
					</div>
				</div>
			</div>
			<!-- //공휴일 설정 -->
			<p class="sr-only" id="schedule_status" aria-live="polite"></p>

			<div class="ssms-schedule__body">
				<!-- 달력 (tbody는 schedule.js에서 렌더링) -->
				<div class="krds-table-wrap scroll ssms-calendar ssms-schedule__calendar">
					<table class="tbl data">
						<caption class="sr-only" id="calendar_caption"></caption>
						<thead>
						<tr>
							<th scope="col">일</th>
							<th scope="col">월</th>
							<th scope="col">화</th>
							<th scope="col">수</th>
							<th scope="col">목</th>
							<th scope="col">금</th>
							<th scope="col">토</th>
						</tr>
						</thead>
						<tbody id="calendar_body"></tbody>
					</table>
				</div>
				<!-- //달력 -->

				<!-- 투입 인원 (tbody는 schedule.js에서 렌더링) -->
				<aside class="ssms-schedule__aside" aria-labelledby="tit_members">
					<div class="ssms-schedule__aside-head">
						<h3 class="ssms-schedule__subtitle" id="tit_members">투입 인원 <span class="krds-badge bg-light-gray" id="member_count"></span></h3>
						<button type="button" class="krds-btn small secondary open-modal" data-target="modal_unavailable">불가일 등록</button>
					</div>
					<div class="krds-table-wrap ssms-members">
						<table class="tbl data">
							<caption class="sr-only" id="members_caption"></caption>
							<thead>
							<tr>
								<th scope="col">이름</th>
								<th scope="col">오전</th>
								<th scope="col">오후</th>
								<th scope="col">종일</th>
							</tr>
							</thead>
							<tbody id="members_body"></tbody>
						</table>
					</div>

					<!-- 투입 인원 수정 -->
					<div class="krds-disclosure conts-expand-area ssms-member">
						<button type="button" class="btn-conts-expand">투입 인원 수정</button>
						<div class="expand-wrap">
							<div class="expand-in">
								<form id="member_form" novalidate>
									<div class="fieldset">
										<div class="form-group">
											<div class="form-tit">
												<label for="member_name">이름</label>
											</div>
											<div class="form-conts">
												<input type="text" id="member_name" class="krds-input" maxlength="20" autocomplete="off" aria-describedby="member_name_hint">
											</div>
											<p class="form-hint" id="member_name_hint">20자 이내로 입력해 주세요.</p>
										</div>
										<button type="submit" class="krds-btn medium secondary">인원 추가</button>
									</div>
								</form>
								<!-- 인원 목록(수정, 삭제)은 schedule.js에서 렌더링 -->
								<ul class="ssms-member__list" id="member_list" aria-label="투입 인원 목록" tabindex="-1"></ul>
							</div>
						</div>
					</div>
					<!-- //투입 인원 수정 -->
				</aside>
				<!-- //투입 인원 -->
			</div>
		</div>
	</main>
</div>

<!-- 근무 불가일 등록 모달 -->
<section id="modal_unavailable" class="krds-modal fade" role="dialog" aria-labelledby="tit_modal_unavailable">
	<div class="modal-dialog modal-md">
		<div class="modal-content">
			<div class="modal-header">
				<h2 id="tit_modal_unavailable" class="modal-title">근무 불가일 등록</h2>
			</div>
			<div class="modal-conts">
				<div class="conts-area">
					<div class="form-group">
						<div class="form-tit">
							<label for="unavailable_member">투입 인원</label>
						</div>
						<div class="form-conts">
							<select id="unavailable_member" class="krds-form-select"></select>
						</div>
					</div>
					<fieldset class="fieldset">
						<legend id="unavailable_legend"></legend>
						<p class="form-hint">근무에 들어갈 수 없는 날짜의 오전, 오후를 선택해 주세요. 금요일은 한 명이 종일 근무하므로 종일로 선택합니다. 주말과 공휴일은 제외됩니다.</p>
						<!-- 날짜별 오전/오후 체크박스는 schedule.js에서 렌더링 -->
						<div class="ssms-unavailable" id="unavailable_list"></div>
					</fieldset>
				</div>
			</div>
			<div class="modal-btn btn-wrap">
				<button type="button" class="krds-btn medium tertiary close-modal">취소</button>
				<button type="button" class="krds-btn medium primary close-modal" id="btn_unavailable_save">저장</button>
			</div>
			<button type="button" class="krds-btn medium icon btn-close close-modal">
				<span class="sr-only">닫기</span>
				<i class="svg-icon ico-popup-close"></i>
			</button>
		</div>
	</div>
	<div class="modal-back"></div>
</section>
<!-- //근무 불가일 등록 모달 -->

<!-- 근무 수정 모달 -->
<section id="modal_duty_edit" class="krds-modal fade" role="dialog" aria-labelledby="tit_modal_duty_edit">
	<div class="modal-dialog modal-sm">
		<div class="modal-content">
			<div class="modal-header">
				<h2 id="tit_modal_duty_edit" class="modal-title">근무 수정</h2>
			</div>
			<div class="modal-conts">
				<div class="conts-area">
					<!-- 달력에서 누른 날짜의 근무 칸(월~목: 오전/오후, 금: 종일)은 schedule.js에서 렌더링 -->
					<div class="fieldset" id="duty_slots"></div>
				</div>
			</div>
			<div class="modal-btn btn-wrap">
				<button type="button" class="krds-btn medium tertiary close-modal">취소</button>
				<button type="button" class="krds-btn medium primary close-modal" id="btn_duty_save">저장</button>
			</div>
			<button type="button" class="krds-btn medium icon btn-close close-modal">
				<span class="sr-only">닫기</span>
				<i class="svg-icon ico-popup-close"></i>
			</button>
		</div>
	</div>
	<div class="modal-back"></div>
</section>
<!-- //근무 수정 모달 -->

<!-- 투입 인원 삭제 확인 모달 -->
<section id="modal_member_delete" class="krds-modal fade" role="dialog" aria-labelledby="tit_modal_member_delete">
	<div class="modal-dialog modal-sm">
		<div class="modal-content">
			<div class="modal-header">
				<h2 id="tit_modal_member_delete" class="modal-title">투입 인원 삭제</h2>
			</div>
			<div class="modal-conts">
				<div class="conts-area">
					<p id="member_delete_message"></p>
				</div>
			</div>
			<div class="modal-btn btn-wrap">
				<button type="button" class="krds-btn medium tertiary close-modal">취소</button>
				<button type="button" class="krds-btn medium primary close-modal" id="btn_member_delete">삭제</button>
			</div>
			<button type="button" class="krds-btn medium icon btn-close close-modal">
				<span class="sr-only">닫기</span>
				<i class="svg-icon ico-popup-close"></i>
			</button>
		</div>
	</div>
	<div class="modal-back"></div>
</section>
<!-- //투입 인원 삭제 확인 모달 -->

<!--
	근무 편성 초기 데이터
	- 처음 실행할 때만 사용하고, 이후 변경 내용은 브라우저 localStorage("ssms.schedule")에 저장된다
	- members: 투입 인원 이름 목록
	- holidays: { "YYYY-MM-DD": "공휴일명" }
	- unavailable: { 이름: ["YYYY-MM-DD_AM" | "YYYY-MM-DD_PM"] }
	- unavailable 금요일: "YYYY-MM-DD_DAY"
	- schedule: { "YYYY-MM-DD": { "AM": 이름, "PM": 이름 } }, 금요일은 { "DAY": 이름 }
-->

<script src="../../krds/resources/js/component/ui-script.js"></script>
<script src="../js/schedule.js"></script>
</body>
</html>
