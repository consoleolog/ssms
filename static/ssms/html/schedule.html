<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>전산근무표 일정 | SSMS</title>
	<link rel="stylesheet" href="../../krds/resources/css/component/output.css">
	<link rel="stylesheet" href="../css/font.css">
	<link rel="stylesheet" href="../css/schedule.css">
</head>
<body>
<div id="wrap">
	<main id="container">
		<div class="inner ssms-schedule">
			<!-- 페이지 제목 -->
			<div class="ssms-schedule__header">
				<h2 class="ssms-schedule__title">전산근무표</h2>
				<button type="button" class="krds-btn medium primary" id="btn_auto_assign">근무 자동 편성</button>
			</div>
			<!-- //페이지 제목 -->

			<!-- 달력 툴바 -->
			<div class="ssms-schedule__toolbar">
				<div class="ssms-schedule__nav">
					<button type="button" class="krds-btn medium icon border" id="btn_prev_month">
						<span class="sr-only">이전 달</span>
						<i class="svg-icon ico-angle left"></i>
					</button>
					<h3 class="ssms-schedule__month" id="schedule_month"></h3>
					<button type="button" class="krds-btn medium icon border" id="btn_next_month">
						<span class="sr-only">다음 달</span>
						<i class="svg-icon ico-angle right"></i>
					</button>
					<button type="button" class="krds-btn small tertiary" id="btn_today">오늘</button>
				</div>
				<div class="ssms-schedule__filter">
					<div class="krds-badge-wrap" aria-label="근무 범례">
						<span class="krds-badge bg-light-primary">오전</span>
						<span class="krds-badge bg-light-point">오후</span>
					</div>
					<select class="krds-form-select small ssms-schedule__select" id="schedule_filter" title="근무 유형 선택">
						<option value="">전체 근무</option>
						<option value="AM">오전</option>
						<option value="PM">오후</option>
					</select>
				</div>
			</div>
			<!-- //달력 툴바 -->
			<p class="sr-only" id="schedule_status" aria-live="polite"></p>

			<div class="ssms-schedule__body">
				<!-- 달력 (tbody는 schedule.js에서 렌더링) -->
				<div class="krds-table-wrap scroll ssms-calendar ssms-schedule__calendar">
					<table class="tbl data">
						<caption class="sr-only" id="calendar_caption"></caption>
						<thead>
						<tr>
							<th scope="col">일</th>
							<th scope="col">월</th>
							<th scope="col">화</th>
							<th scope="col">수</th>
							<th scope="col">목</th>
							<th scope="col">금</th>
							<th scope="col">토</th>
						</tr>
						</thead>
						<tbody id="calendar_body"></tbody>
					</table>
				</div>
				<!-- //달력 -->

				<!-- 투입 인원 (tbody는 schedule.js에서 렌더링) -->
				<aside class="ssms-schedule__aside" aria-labelledby="tit_members">
					<div class="ssms-schedule__aside-head">
						<h3 class="ssms-schedule__subtitle" id="tit_members">투입 인원 <span class="krds-badge bg-light-gray" id="member_count"></span></h3>
						<button type="button" class="krds-btn small secondary open-modal" data-target="modal_unavailable">불가일 등록</button>
					</div>
					<div class="krds-table-wrap ssms-members">
						<table class="tbl data">
							<caption class="sr-only" id="members_caption"></caption>
							<thead>
							<tr>
								<th scope="col">이름</th>
								<th scope="col">오전</th>
								<th scope="col">오후</th>
							</tr>
							</thead>
							<tbody id="members_body"></tbody>
						</table>
					</div>
				</aside>
				<!-- //투입 인원 -->
			</div>
		</div>
	</main>
</div>

<!-- 근무 불가일 등록 모달 -->
<section id="modal_unavailable" class="krds-modal fade" role="dialog" aria-labelledby="tit_modal_unavailable">
	<div class="modal-dialog modal-md">
		<div class="modal-content">
			<div class="modal-header">
				<h2 id="tit_modal_unavailable" class="modal-title">근무 불가일 등록</h2>
			</div>
			<div class="modal-conts">
				<div class="conts-area">
					<div class="form-group">
						<div class="form-tit">
							<label for="unavailable_member">투입 인원</label>
						</div>
						<div class="form-conts">
							<select id="unavailable_member" class="krds-form-select"></select>
						</div>
					</div>
					<fieldset class="fieldset">
						<legend id="unavailable_legend"></legend>
						<p class="form-hint">근무에 들어갈 수 없는 날짜의 오전, 오후를 선택해 주세요. 주말과 공휴일은 제외됩니다.</p>
						<!-- 날짜별 오전/오후 체크박스는 schedule.js에서 렌더링 -->
						<div class="ssms-unavailable" id="unavailable_list"></div>
					</fieldset>
				</div>
			</div>
			<div class="modal-btn btn-wrap">
				<button type="button" class="krds-btn medium tertiary close-modal">취소</button>
				<button type="button" class="krds-btn medium primary close-modal" id="btn_unavailable_save">저장</button>
			</div>
			<button type="button" class="krds-btn medium icon btn-close close-modal">
				<span class="sr-only">닫기</span>
				<i class="svg-icon ico-popup-close"></i>
			</button>
		</div>
	</div>
	<div class="modal-back"></div>
</section>
<!-- //근무 불가일 등록 모달 -->
